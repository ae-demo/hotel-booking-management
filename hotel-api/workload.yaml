apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: hotel-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: hotel-booking-man-854b95ff
      envBindings:
        dbname: HOTEL_DB_DBNAME
        host: HOTEL_DB_HOST
        password: HOTEL_DB_PASSWORD
        port: HOTEL_DB_PORT
        user: HOTEL_DB_USER
    - ref: hotel-booking-man-5931b6cc
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: hotel-booking-man-b3f764ac
      envBindings:
        SAMPATH_HASH_SECRET: SAMPATH_HASH_SECRET
        SAMPATH_MERCHANT_ID: SAMPATH_MERCHANT_ID
    - ref: hotel-booking-man-f5dcc876
      envBindings:
        BOOKING_API_PASSWORD: BOOKING_API_PASSWORD
        BOOKING_API_USERNAME: BOOKING_API_USERNAME
        BOOKING_HOTEL_ID: BOOKING_HOTEL_ID
    - ref: hotel-booking-man-70de504e
      envBindings:
        SENDGRID_API_KEY: SENDGRID_API_KEY
        SENDGRID_FROM_EMAIL: SENDGRID_FROM_EMAIL
    - ref: hotel-booking-man-a8ccf6ac
      envBindings:
        TWILIO_ACCOUNT_SID: TWILIO_ACCOUNT_SID
        TWILIO_AUTH_TOKEN: TWILIO_AUTH_TOKEN
        TWILIO_WHATSAPP_FROM: TWILIO_WHATSAPP_FROM
