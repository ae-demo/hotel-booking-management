apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: hotel-admin-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: hotel-booking-management-hotel-api
      name: http
      visibility: project
      envBindings:
        address: HOTEL_API_URL
  resources:
    - ref: hotel-booking-man-5931b6cc
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
